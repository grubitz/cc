<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Calendar with the Sacred and Immaculate Hearts">
  <rect width="64" height="64" rx="12" fill="#7a2e2e"/>

  <!-- Calendar: two rings, a body, and a header rule. -->
  <rect x="19" y="7" width="5.5" height="11" rx="2.75" fill="#fbfaf7"/>
  <rect x="39.5" y="7" width="5.5" height="11" rx="2.75" fill="#fbfaf7"/>
  <rect x="8" y="13" width="48" height="43" rx="5" fill="#fbfaf7"/>
  <rect x="8" y="22" width="48" height="2.6" fill="#7a2e2e"/>

  <!-- A cross standing on each heart. Kept short and heavy so the pair still
       reads as two hearts rather than two blobs at 16px. -->
  <g fill="#7a2e2e">
    <path d="M20.7 26h2.6v8.5h-2.6zM18 28.6h8v2.6h-8z"/>
    <path d="M40.7 26h2.6v8.5h-2.6zM38 28.6h8v2.6h-8z"/>
  </g>

  <!-- Hearts. Same path, placed twice. -->
  <g fill="#7a2e2e">
    <path transform="translate(11.6 32.7) scale(1.3)"
          d="M8 15S1 10.5 1 5.8C1 3 3 1 5.4 1 6.9 1 8 2 8 2s1.1-1 2.6-1C13 1 15 3 15 5.8 15 10.5 8 15 8 15z"/>
    <path transform="translate(31.6 32.7) scale(1.3)"
          d="M8 15S1 10.5 1 5.8C1 3 3 1 5.4 1 6.9 1 8 2 8 2s1.1-1 2.6-1C13 1 15 3 15 5.8 15 10.5 8 15 8 15z"/>
  </g>

  <!-- Sword through the Immaculate Heart, cut in the cream of the page. -->
  <path d="M51.5 36 36.5 51" stroke="#fbfaf7" stroke-width="3" stroke-linecap="round"/>
  <path d="M48.4 34.4 52.9 38.9" stroke="#fbfaf7" stroke-width="2.4" stroke-linecap="round"/>
</svg>
